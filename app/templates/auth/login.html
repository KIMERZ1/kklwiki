{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card card-narrow">
    <h1 class="page-title">로그인</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        <div class="field">{{ form.username.label }} {{ form.username() }}</div>
        <div class="field">{{ form.password.label }} {{ form.password() }}</div>
        <button type="submit">로그인</button>
    </form>
    <p class="meta">계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a></p>
</div>
{% endblock %}
